[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "callserver"
version = "0.1.1"
description = "Shared-memory RPC for fast inter-process function calls with numpy arrays."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dexman-ai" }]
requires-python = ">=3.8"
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/dexman-ai/CallServer"
Repository = "https://github.com/dexman-ai/CallServer"
Issues = "https://github.com/dexman-ai/CallServer/issues"

[project.scripts]
callserver = "callserver:run_console"

[tool.setuptools]
packages = ["callserver"]

[tool.setuptools.package-data]
callserver = ["py.typed", "callserver.md"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
